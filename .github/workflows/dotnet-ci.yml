name: .NET CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10

      - name: Restore dependencies
        run: dotnet restore src/UrlShortenerBackend/UrlShortenerBackend.csproj

      - name: Build service
        run: dotnet build src/UrlShortenerBackend/UrlShortenerBackend.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test test/UrlShortenerBackendTests/UrlShortenerBackendTests.csproj --configuration Release --no-restore --verbosity normal

      - name: Build Docker image
        run: docker build -t urlshortener-api .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: urlshortener-api
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: image
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/urlshortener-api"
          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Tag Docker image
        run: |
          docker tag urlshortener-api \
            ${{ steps.image.outputs.image_name }}:latest

      - name: Push Docker image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker push \
            ${{ steps.image.outputs.image_name }}:latest
